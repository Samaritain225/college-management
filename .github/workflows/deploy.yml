name: Deploy to Cloudflare Workers

# main ships to production (wagnon); dev ships to the development Worker
# (wagnon-dev). Which GitHub Environment (and therefore which Supabase
# project's VITE_* vars) a run uses is selected below by branch.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type-check + build. tsc -b runs as part of `npm run build` (see
      # package.json) — a type error fails the deploy here, same as it
      # would locally, instead of shipping broken JS. @cloudflare/vite-plugin
      # (wired into vite.config.ts) resolves wrangler.jsonc during THIS step
      # and writes dist/wrangler.json — which is what the deploy step below
      # actually deploys through, not wrangler.jsonc directly. That means
      # the Cloudflare environment must be chosen here, via CLOUDFLARE_ENV,
      # not with a `wrangler deploy --env` flag on the deploy step (that flag
      # is a no-op against an already-flattened config — see the
      # CLOUDFLARE_ENV gotcha in .agents/AGENTS.md).
      - run: npm run build
        env:
          CLOUDFLARE_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
          # Build-time only — Vite inlines these into the bundle, so they
          # must be present now, not just at runtime. All four are
          # documented as public/safe to expose in .env.example
          # (publishable key, Turnstile *site* key, a public R2 read base,
          # and the project URL) — real secrets (service_role, R2 write
          # credentials) never touch this file or any Vite env var.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_R2_PUBLIC_BASE_URL: ${{ vars.VITE_R2_PUBLIC_BASE_URL }}

      # No --env flag here on purpose: the environment was already baked
      # into dist/wrangler.json by the build step above via CLOUDFLARE_ENV.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
