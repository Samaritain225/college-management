name: Deploy to Cloudflare Workers

# Production only — a push to main is the only thing that ships.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Type-check + build. tsc -b runs as part of `npm run build` (see
      # package.json) — a type error fails the deploy here, same as it
      # would locally, instead of shipping broken JS. @cloudflare/vite-plugin
      # (wired into vite.config.ts) resolves wrangler.jsonc during this step
      # and writes dist/wrangler.json, which the deploy step below reads.
      - run: npm run build
        env:
          # Build-time only — Vite inlines these into the bundle, so they
          # must be present now, not just at runtime. All four are
          # documented as public/safe to expose in .env.example
          # (publishable key, Turnstile *site* key, a public R2 read base,
          # and the project URL) — real secrets (service_role, R2 write
          # credentials) never touch this file or any Vite env var.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_R2_PUBLIC_BASE_URL: ${{ vars.VITE_R2_PUBLIC_BASE_URL }}

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
