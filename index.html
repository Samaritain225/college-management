<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f3d3e" />
    <title>Wagnon Budget</title>
    <script>
      // Set the theme class before first paint. ThemeProvider reads the same
      // localStorage key, but it applies the class in an effect — which runs
      // after the first paint, so without this every dark-mode user saw a
      // flash of the light theme on load. Keep the key and the fallback in
      // sync with src/lib/theme.tsx.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {
          /* storage blocked (private browsing) — light default is fine */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
